[package]
name = "rollover-proxy"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Proxy de GameCore_XP2_FinalRelease.dll pour Civ6, posé à côté sous le nom BGD_GameCore_XP2.dll"

# Paquet autonome, hors de l'espace de travail du solveur : il ne vise que Windows x64.
[workspace]

[lib]
name = "BGD_GameCore_XP2"
crate-type = ["cdylib"]
path = "src/lib.rs"

# Outils de diagnostic (voir release/README.md, « Diagnostic ») : compilés par défaut, pour les
# builds locaux ; la release les retire (cargo build --release --no-default-features).
[features]
default = ["diag"]
diag = []

[profile.release]
opt-level = 3
# Pas de déroulement de pile à travers le code du jeu.
panic = "abort"
