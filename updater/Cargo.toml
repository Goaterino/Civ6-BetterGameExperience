[package]
name = "bgd-updater"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Installe, met à jour, répare ou retire les proxys de BetterGameExperience à partir des releases GitHub"

# Paquet autonome, comme proxy/ : Windows x64, et macOS (arm64 et x86_64) pour le lanceur Mac.
[workspace]

[[bin]]
name = "BetterGameExperience"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
ed25519-dalek = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

# macOS : fenêtres AppKit (NSAlert), HTTPS par la pile TLS du système (Security.framework).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
native-tls = "0.2"
ureq = { version = "2", default-features = false, features = ["native-tls"] }

[profile.release]
opt-level = "s"
strip = true

[build-dependencies]
embed-resource = "3.0.12"
