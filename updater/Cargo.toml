[package]
name = "bgd-updater"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Installe, met à jour, répare ou retire les proxys de BetterGameExperience à partir des releases GitHub"

# Paquet autonome, comme proxy/. Trois cibles : Windows x64 (exe, chaîne MSVC), Linux x86_64 (binaire
# statique musl, pour Steam Play) et macOS (arm64 et x86_64, le lanceur Mac), voir src/main.rs.
[workspace]

[[bin]]
name = "BetterGameExperience"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
ed25519-dalek = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

# Linux : HTTPS par ureq 3 (rustls, certificats racine embarqués) ; Windows passe par WinHTTP. Pas
# `cfg(unix)` : macOS a ses propres dépendances, ci-dessous.
[target.'cfg(target_os = "linux")'.dependencies]
ureq = "3"

# macOS : fenêtres AppKit (NSAlert), HTTPS par ureq 2 et la pile TLS du système (Security.framework).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
native-tls = "0.2"
ureq = { version = "2", default-features = false, features = ["native-tls"] }

[features]
# Installeur de test (updater/macos/test) : fait confiance à la clé de test du dépôt, et non à celle
# des releases. Jamais dans le workflow de release.
cle-de-test = []

[profile.release]
opt-level = "s"
strip = true

[build-dependencies]
embed-resource = "3.0.12"
