# Release de BetterGameExperience (voir release/README.md).
# Un tag vX.Y.Z compile les deux proxys, signe le manifeste et crée une release en brouillon
# « (à signer) ». La signature Authenticode se fait ensuite depuis un PC (release/signer.ps1) : la clé
# du certificat ne peut pas servir ici. Puis le brouillon est relu et publié à la main : l'updater ne
# voit que les releases publiées. Lancé à la main (workflow_dispatch), il compile et signe le
# manifeste sans créer de release ; les fichiers restent en artefact.
name: release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

# One build job per platform, each uploading a `<platform>-dist` artifact; the release job merges
# them, signs the manifest and creates the draft.
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Static musl binary: runs on any distribution, including SteamOS.
      - name: Rust (musl)
        run: |
          rustup target add x86_64-unknown-linux-musl
          sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Tests
        run: cd updater_linux && cargo test --release --locked

      - name: Compilation
        run: |
          cd updater_linux && cargo build --release --locked --target x86_64-unknown-linux-musl
          mkdir -p ../linux-dist
          cp target/x86_64-unknown-linux-musl/release/BetterGameExperience ../linux-dist/BetterGameExperience-linux-x86_64
          cp ../install.sh ../linux-dist/install.sh

      - uses: actions/upload-artifact@v7
        with:
          name: linux-dist
          path: linux-dist/

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.0-dev"; fi
          echo "VERSION=$v" >> "$GITHUB_ENV"

      # Proxys : chaîne GNU, avec son éditeur de liens embarqué (startup_proxy/build.rs passe un .def
      # à ld). Installeur : chaîne MSVC (updater/build.rs), pour ses ressources (rc.exe) et un binaire
      # que les antivirus confondent moins avec un logiciel malveillant.
      - name: Rust (GNU et MSVC)
        run: |
          rustup toolchain install stable-x86_64-pc-windows-gnu stable-x86_64-pc-windows-msvc --profile minimal
          rustup default stable-x86_64-pc-windows-gnu

      # Avec et sans les outils de diagnostic (feature `diag`, par défaut), que la release omet.
      - name: Tests
        run: |
          (cd proxy && cargo test --release && cargo test --release --no-default-features)
          (cd startup_proxy && cargo test --release && cargo test --release --no-default-features)
          (cd updater && cargo +stable-x86_64-pc-windows-msvc test --release)
          (cd rapport_worker && node --test test/index.test.js)

      # Sur un tag, la version de la release est gravée dans les DLL (proxy/src/version.rs, RELEASE) :
      # le proxy de démarrage s'en sert pour la notification de mise à jour. Sans la feature `diag` :
      # ni profil des zones, ni journal des scripts, ni mesure des épingles, ni diagnostic des accords
      # (release/README.md, « Diagnostic »).
      # BGE_RAPPORT_URL : adresse du relais des rapports de bug (rapport_worker/README.md), variable
      # du dépôt (Settings > Secrets and variables > Actions > Variables). Vide : les rapports restent
      # sur le Bureau du joueur.
      - name: Compilation
        env:
          BGE_RAPPORT_URL: ${{ vars.BGE_RAPPORT_URL }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then export BGD_RELEASE="$VERSION"; fi
          (cd proxy && cargo build --release --no-default-features)
          (cd startup_proxy && cargo build --release --no-default-features)
          (cd updater && cargo +stable-x86_64-pc-windows-msvc build --release)
          mkdir windows-dist
          cp proxy/target/release/BGD_GameCore_XP2.dll startup_proxy/target/release/winmm.dll windows-dist/
          # Nom versionné : un joueur voit quelle version il a téléchargée. Lancé, l'installeur retire
          # les plus anciens du même dossier et se copie sous le nom fixe BetterGameExperience.exe
          # (updater/README.md).
          cp updater/target/release/BetterGameExperience.exe "windows-dist/BetterGameExperience_V$VERSION.exe"

      - uses: actions/upload-artifact@v7
        with:
          name: windows-dist
          path: windows-dist/

  release:
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.0-dev"; fi
          echo "VERSION=$v" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # Textes traduits (textes/README.md) : fichiers générés à jour, chaque texte dans chaque langue,
      # mêmes paramètres que l'anglais. Sur un tag, le changelog de la version doit exister.
      - name: Textes et changelog
        run: |
          python textes/gen_textes.py --check --strict
          if [ "$GITHUB_REF_TYPE" = tag ]; then python release/notes.py "$VERSION" "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" > notes.md; fi

      - uses: actions/download-artifact@v7
        with:
          pattern: "*-dist"
          merge-multiple: true
          path: dist/

      - name: Manifeste signé
        env:
          BGD_SIGNING_KEY: ${{ secrets.BGD_SIGNING_KEY }}
        run: |
          pip install cryptography
          v="$VERSION"; [ "$GITHUB_REF_TYPE" = tag ] || v=0.0.0
          python release/manifest.py build --version "$v" --out dist/manifest.json dist
          python release/manifest.py sign dist/manifest.json
          python release/manifest.py verify dist/manifest.json

      - uses: actions/upload-artifact@v7
        with:
          name: BetterGameExperience-${{ env.VERSION }}
          path: dist/

      # « (à signer) » : release/signer.ps1 retire ce suffixe une fois les fichiers signés. Pas
      # d'attestation de provenance : elle porterait sur les fichiers non signés, que la signature remplace.
      - name: Release en brouillon
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --draft --title "BetterGameExperience $VERSION (à signer)" --notes-file notes.md
