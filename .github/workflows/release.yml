# Release de BetterGameDLLs (voir release/README.md).
# Un tag vX.Y.Z compile les deux proxys, signe le manifeste et crée une release en brouillon, à relire
# puis publier à la main : l'updater ne voit que les releases publiées. Lancé à la main
# (workflow_dispatch), il compile et signe sans créer de release ; les fichiers restent en artefact.
name: release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.0-dev"; fi
          echo "VERSION=$v" >> "$GITHUB_ENV"

      # Même chaîne d'outils qu'en local : GNU, avec son éditeur de liens embarqué (startup_proxy/build.rs
      # passe un .def à ld).
      - name: Rust (GNU)
        run: |
          rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal
          rustup default stable-x86_64-pc-windows-gnu

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # Textes traduits (textes/README.md) : fichiers générés à jour, chaque texte dans chaque langue,
      # mêmes paramètres que l'anglais. Sur un tag, le changelog de la version doit exister.
      - name: Textes et changelog
        run: |
          python textes/gen_textes.py --check --strict
          if [ "$GITHUB_REF_TYPE" = tag ]; then python release/notes.py "$VERSION" "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" > notes.md; fi

      # Avec et sans les outils de diagnostic (feature `diag`, par défaut), que la release omet.
      - name: Tests
        run: |
          (cd proxy && cargo test --release && cargo test --release --no-default-features)
          (cd startup_proxy && cargo test --release && cargo test --release --no-default-features)
          (cd updater && cargo test --release)

      # Sur un tag, la version de la release est gravée dans les DLL (proxy/src/version.rs, RELEASE) :
      # le proxy de démarrage s'en sert pour la notification de mise à jour. Sans la feature `diag` :
      # ni profil des zones, ni journal des scripts, ni mesure des épingles, ni diagnostic des accords
      # (release/README.md, « Diagnostic »).
      - name: Compilation
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then export BGD_RELEASE="$VERSION"; fi
          (cd proxy && cargo build --release --no-default-features)
          (cd startup_proxy && cargo build --release --no-default-features)
          (cd updater && cargo build --release)
          mkdir dist
          cp proxy/target/release/BGD_GameCore_XP2.dll startup_proxy/target/release/winmm.dll dist/
          cp updater/target/release/BetterGameDLLs.exe dist/

      - name: Manifeste signé
        env:
          BGD_SIGNING_KEY: ${{ secrets.BGD_SIGNING_KEY }}
        run: |
          pip install cryptography
          v="$VERSION"; [ "$GITHUB_REF_TYPE" = tag ] || v=0.0.0
          python release/manifest.py build --version "$v" --out dist/manifest.json dist
          python release/manifest.py sign dist/manifest.json
          python release/manifest.py verify dist/manifest.json

      # Provenance des binaires (gh attestation verify) : réservée aux dépôts publics hors offre Enterprise.
      - uses: actions/attest-build-provenance@v4
        if: ${{ !github.event.repository.private }}
        with:
          subject-path: dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: BetterGameDLLs-${{ env.VERSION }}
          path: dist/

      - name: Release en brouillon
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --draft --title "BetterGameDLLs $VERSION" --notes-file notes.md
