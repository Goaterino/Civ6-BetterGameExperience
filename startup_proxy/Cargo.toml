[package]
name = "startup-proxy"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Proxy de DatabaseDLL_FinalRelease.dll pour Civ6 : chargé au démarrage de l'exe, avant le menu principal"

# Paquet autonome, comme proxy/ : il ne vise que Windows x64.
[workspace]

[lib]
name = "DatabaseDLL_FinalRelease"
crate-type = ["cdylib"]
path = "src/lib.rs"

# Outils de diagnostic (voir release/README.md, « Diagnostic ») : compilés par défaut, pour les
# builds locaux ; la release les retire (cargo build --release --no-default-features).
[features]
default = ["diag"]
diag = []

[profile.release]
opt-level = 3
# Pas de déroulement de pile à travers le code du jeu.
panic = "abort"
