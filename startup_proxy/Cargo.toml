[package]
name = "startup-proxy"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Proxy de démarrage pour Civ6 : winmm.dll posée à côté de l'exe, chargée avant le menu principal"

# Paquet autonome, comme proxy/ : il ne vise que Windows x64.
[workspace]

# Compression des rapports de bug (rapport.rs), en Rust pur.
[dependencies]
miniz_oxide = "0.8"

[lib]
name = "winmm"
crate-type = ["cdylib"]
path = "src/lib.rs"

# Outils de diagnostic (voir release/README.md, « Diagnostic ») : compilés par défaut, pour les
# builds locaux ; la release les retire (cargo build --release --no-default-features).
[features]
default = ["diag"]
diag = []

[profile.release]
opt-level = 3
# Pas de déroulement de pile à travers le code du jeu.
panic = "abort"
